<!-- Static copy: the WordPress contact form cannot post to a server (and info@thepalms.uz has no mailbox),
     so the form opens a WhatsApp chat with the hostel's phone number and the filled-in text. -->
<script>
document.addEventListener('submit', function (e) {
  var form = e.target;
  if (!form.classList || !form.classList.contains('elementor-form')) return;
  e.preventDefault();
  e.stopImmediatePropagation();
  function v(name) { var el = form.querySelector('[name="' + name + '"]'); return el ? el.value.trim() : ''; }
  var text = 'Request from thepalms.uz\n' +
             'Name: ' + v('form_fields[name]') + '\n' +
             'Phone: ' + v('form_fields[field_e16c8f0]') + '\n' +
             'Email: ' + v('form_fields[email]') + '\n\n' +
             v('form_fields[message]');
  window.open('https://wa.me/998903328333?text=' + encodeURIComponent(text), '_blank');
}, true);
</script>
